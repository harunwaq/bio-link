<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reader">
<meta name="description" content="Read PDFs and Markdown files in dark mode, offline, with your own notes. Files stay on your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Reader</title>
</head>
<body class="theme-dark">

<!-- Library -->
<section id="library" class="view">
  <header class="bar lib-bar">
    <h1>Reader</h1>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings and backup">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>
  <div class="lib-tools">
    <input id="libSearch" type="search" placeholder="Search your files">
    <div id="folderChips" class="chips"></div>
  </div>
  <div id="installHint" class="hint" hidden></div>
  <div id="backupHint" class="hint" hidden></div>
  <div id="docList"></div>
  <div id="empty" class="empty" hidden>
    <p class="empty-title">No files yet</p>
    <p>Tap <b>Add file</b> to open a PDF or Markdown file from your phone. It is saved inside this app, so it opens offline next time, at the spot where you stopped.</p>
  </div>
  <button class="fab" id="addBtn">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    <span>Add file</span>
  </button>
</section>

<!-- Reader -->
<section id="reader" class="view" hidden>
  <header class="bar top-bar">
    <button id="backBtn" class="icon-btn" aria-label="Back to library">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="doc-title" id="docTitle"></div>
    <button id="filesBtn" class="icon-btn" aria-label="Switch file">
      <svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>
    </button>
    <button id="themeBtn" class="icon-btn" aria-label="Change theme">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
    <button id="notesBtn" class="icon-btn" aria-label="All notes">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v12l-4 4H5z"/><path d="M15 20v-4h4M8 9h8M8 13h5"/></svg>
      <span class="badge" id="noteCount" hidden></span>
    </button>
  </header>

  <div id="scroller">
    <div id="pages"></div>
  </div>

  <div id="placeBanner" class="banner" hidden>
    <span>Tap the spot for your note</span>
    <button id="placeCancel" class="text-btn">Cancel</button>
  </div>

  <button id="selNoteBtn" class="sel-btn" hidden>
    <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
    Highlight and note
  </button>

  <footer class="bar bottom-bar">
    <button id="zoomOut" class="icon-btn" aria-label="Smaller"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="zoomFit" class="text-btn" aria-label="Reset size">Fit</button>
    <button id="zoomIn" class="icon-btn" aria-label="Bigger"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="pageBtn" class="page-btn" aria-label="Go to page"><span id="pageNow">1</span></button>
    <button id="addNoteBtn" class="primary-btn">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Note
    </button>
  </footer>
  <div id="pagePill" class="page-pill"></div>
</section>

<div id="loading" class="loading" hidden><div class="spinner"></div><span id="loadingText">Opening…</span></div>

<!-- Note editor -->
<div id="noteSheet" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head">
      <span id="noteSheetTitle">New note</span>
      <button id="noteClose" class="text-btn">Cancel</button>
    </div>
    <blockquote id="noteQuote" hidden></blockquote>
    <textarea id="noteText" rows="5" placeholder="Write your note" dir="auto"></textarea>
    <div class="colors" id="noteColors">
      <button data-c="yellow" class="chip c-yellow" aria-label="Yellow"></button>
      <button data-c="green" class="chip c-green" aria-label="Green"></button>
      <button data-c="blue" class="chip c-blue" aria-label="Blue"></button>
      <button data-c="pink" class="chip c-pink" aria-label="Pink"></button>
    </div>
    <div class="sheet-actions">
      <button id="noteDelete" class="danger-btn" hidden>Delete</button>
      <span class="spacer"></span>
      <button id="noteSave" class="primary-btn">Save</button>
    </div>
  </div>
</div>

<!-- Notes list -->
<div id="notesPanel" class="sheet" hidden>
  <div class="sheet-card tall">
    <div class="sheet-head">
      <span>Notes</span>
      <button id="notesClose" class="text-btn">Done</button>
    </div>
    <input id="notesSearch" type="search" placeholder="Search notes">
    <div id="notesList" class="scroll-list"></div>
    <div class="sheet-actions">
      <button id="notesCopy" class="text-btn">Copy all</button>
      <span class="spacer"></span>
      <button id="notesExport" class="primary-btn">Send with comments</button>
    </div>
  </div>
</div>

<!-- File switcher -->
<div id="filesPanel" class="sheet" hidden>
  <div class="sheet-card tall">
    <div class="sheet-head">
      <span>Your files</span>
      <button id="filesClose" class="text-btn">Done</button>
    </div>
    <input id="filesSearch" type="search" placeholder="Search your files">
    <div id="filesList" class="scroll-list"></div>
    <div class="sheet-actions">
      <span class="small">Each file stays at the spot where you left it.</span>
      <span class="spacer"></span>
      <button id="filesAdd" class="primary-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add from phone</button>
    </div>
  </div>
</div>

<!-- Generic action sheet -->
<div id="actionSheet" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><span id="actionTitle"></span><button id="actionClose" class="text-btn">Close</button></div>
    <div id="actionBody" class="scroll-list"></div>
  </div>
</div>

<input type="file" id="fileInput" accept=".pdf,.md,.markdown,.txt,application/pdf,text/markdown,text/plain" multiple hidden>
<input type="file" id="restoreInput" accept=".zip,.json,application/zip,application/json" hidden>
<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
