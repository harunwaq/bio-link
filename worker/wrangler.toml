name = "biolink-worker"
main = "src/index.ts"
compatibility_date = "2024-05-12"

# JWT_SECRET is a secret, so it is not in this file (the repo is public).
# Set it once with: npx wrangler secret put JWT_SECRET
# or in the Cloudflare dashboard: biolink-worker > Settings > Variables and Secrets.
[vars]
FRONTEND_URL = "https://bio-link-ap1.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "biolink-db"
database_id = "f76cc7a8-9987-467b-a1a9-9ecf1a3dc7b3"

[[kv_namespaces]]
binding = "SESSIONS"
id = "ca4fa8f4685e42909cb3680a4644dc04"

# R2 bucket - enable R2 in Cloudflare dashboard first, then uncomment:
# [[r2_buckets]]
# binding = "AVATARS"
# bucket_name = "biolink-avatars"
